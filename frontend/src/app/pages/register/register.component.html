<div class="register-container">
  <div class="register-card">
    <h1>Create Account</h1>
    <p class="subtitle">Join us today</p>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="onSubmit()"
      class="register-form"
    >
      <div class="form-group">
        <label for="name">Full Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          class="form-control"
          [class.is-invalid]="submitted && f['name'].invalid"
          placeholder="Enter your full name"
        />
        <div *ngIf="submitted && f['name'].invalid" class="invalid-feedback">
          <span *ngIf="f['name'].errors?.['required']">Name is required</span>
          <span *ngIf="f['name'].errors?.['minlength']"
            >Name must be at least 2 characters</span
          >
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="submitted && f['email'].invalid"
          placeholder="Enter your email"
        />
        <div *ngIf="submitted && f['email'].invalid" class="invalid-feedback">
          <span *ngIf="f['email'].errors?.['required']">Email is required</span>
          <span *ngIf="f['email'].errors?.['email']"
            >Please enter a valid email</span
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="submitted && f['password'].invalid"
          placeholder="Enter your password"
        />
        <div
          *ngIf="submitted && f['password'].invalid"
          class="invalid-feedback"
        >
          <span *ngIf="f['password'].errors?.['required']"
            >Password is required</span
          >
          <span *ngIf="f['password'].errors?.['minlength']"
            >Password must be at least 6 characters</span
          >
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          formControlName="confirmPassword"
          class="form-control"
          [class.is-invalid]="submitted && (f['confirmPassword'].invalid || registerForm.errors?.['passwordMismatch'])"
          placeholder="Re-enter your password"
        />
        <div
          *ngIf="submitted && f['confirmPassword'].invalid"
          class="invalid-feedback"
        >
          <span *ngIf="f['confirmPassword'].errors?.['required']"
            >Please confirm your password</span
          >
        </div>
        <div
          *ngIf="submitted && registerForm.errors?.['passwordMismatch']"
          class="invalid-feedback"
        >
          Passwords do not match
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        <span *ngIf="!loading">Register</span>
        <span *ngIf="loading">
          <span class="spinner"></span> Creating Account...
        </span>
      </button>
    </form>

    <p class="login-link">
      Already have an account? <a routerLink="/login">Login here</a>
    </p>
  </div>
</div>
